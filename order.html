<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order · Riwayat روایت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Noto+Nastaliq+Urdu:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/order.css">
<link rel="stylesheet" href="css/chatbot.css">
</head>
<body class="order-page">
<header class="site-header">
  <a class="brand" href="index.html" aria-label="Riwayat home"><img src="assets/img/logo.png" alt="Riwayat Restaurant"></a>
  <a class="back-link" href="index.html">← Back to website</a>
</header>

<main class="order-main wrap">
  <ol class="progress" id="progress" aria-label="Order progress"></ol>
  <div class="order-layout" id="layout">
    <section id="stage" class="stage" aria-live="polite"></section>
    <aside class="cart" id="cart" aria-label="Your order">
      <div class="cart-head"><h3>Your Order</h3><button class="cart-x" data-act="cartclose" aria-label="Close order">×</button></div>
      <div id="cartBody"></div>
    </aside>
  </div>
  <p class="demo-note">Conceptual demo — no real payment is taken and no order is actually sent.</p>
</main>

<button class="cartbar" id="cartbar" data-act="cartopen" hidden>
  <span class="cb-count" id="cbCount">0 items</span>
  <span class="cb-total" id="cbTotal">Rs 0</span>
  <span class="cb-view">View Order ▲</span>
</button>
<div class="scrim" id="scrim" data-act="cartclose" hidden></div>

<script src="data/menu-data.js"></script>
<script src="js/order.js"></script>
<script src="data/celebrations-data.js"></script>
<script src="js/chatbot.js"></script>
</body>
</html>
