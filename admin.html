<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Riwayat</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="adm-body">
<header class="adm-top">
  <a class="brand" href="index.html" aria-label="Riwayat home"><img src="assets/img/logo.png" alt="Riwayat Restaurant"></a>
  <span class="adm-title">Admin</span>
  <span class="adm-user" id="who"></span>
  <button class="btn btn-ghost btn-sm" id="btnOut" hidden>Sign out</button>
</header>

<main id="login" class="adm-login" hidden>
  <form id="loginForm" class="adm-card" autocomplete="on">
    <h1>Staff sign in</h1>
    <p class="mute">For the restaurant administrator and approved staff.</p>
    <label for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="username" required>
    <label for="lPass">Password</label><input id="lPass" type="password" autocomplete="current-password" required>
    <div class="adm-err" id="lErr" role="alert" hidden></div>
    <button class="btn btn-gold" id="lBtn" type="submit">Sign in</button>
  </form>
</main>

<main id="app" class="adm" hidden>
  <nav class="adm-tabs" id="tabs" role="tablist"></nav>
  <div id="notice" class="adm-note" hidden></div>
  <section id="view"></section>
</main>

<div class="savebar" id="savebar" hidden>
  <span id="saveMsg">You have unsaved changes.</span>
  <button class="btn btn-ghost btn-sm" id="btnDiscard">Discard</button>
  <button class="btn btn-gold btn-sm" id="btnSave">Save changes</button>
</div>

<script src="js/vendor/xlsx.full.min.js"></script>
<script src="js/boot.js" data-scripts="data/menu-data.js,data/celebrations-data.js,js/settings.js,js/firebase-config.js,js/fs.js,js/admin-app.js"></script>
</body>
</html>
